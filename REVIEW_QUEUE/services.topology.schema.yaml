$schema: "http://json-schema.org/draft-07/schema#"
title: services.topology.schema
type: object
required: [services]

properties:
  services:
    type: object
    required: [service_groups]

    properties:
      service_groups:
        type: object
        additionalProperties:
          type: object
          required: [label, services]

          properties:
            label:
              type: string

            services:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - id
                  - label
                  - type
                  - exposure
                  - environments
                  - ssh_access

                properties:
                  id:
                    type: string
                    pattern: "^[a-z0-9-]+$"

                  label:
                    type: string

                  type:
                    type: string
                    enum: [application, service, frontend, worker]

                  exposure:
                    type: string
                    enum: [public, internal]

                  internal_use:
                    type: boolean

                  environments:
                    type: array
                    minItems: 1
                    items:
                      type: string

                  ssh_access:
                    type: boolean

                  relations:
                    type: object
                    properties:
                      consumes:
                        type: array
                        items:
                          type: string
                      produces:
                        type: array
                        items:
                          type: string
                      proxies:
                        type: array
                        items:
                          type: string
