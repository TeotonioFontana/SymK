$schema: http://json-schema.org/draft-07/schema#
type: object
required: [defaults, tunnels]

properties:

  defaults:
    type: object
    properties:
      backend:
        enum: [ssm, ssh]

      aws:
        type: object
        properties:
          profile: { type: string }
          region: { type: string }

      ssh:
        type: object
        properties:
          user: { type: string }
          key_path: { type: string }
          identity_strategy:
            enum: [agent_or_key, key_only, ssm_only]

      network:
        type: object
        properties:
          remote_host: { type: string }

      behavior:
        type: object
        properties:
          autostart: { type: boolean }

  tunnels:
    type: object
    additionalProperties:
      type: object
      required: [backend]
      properties:
        backend:
          enum: [ssm, ssh]

        ssm_target:
          type: string

        aws:
          type: object
          properties:
            profile: { type: string }
            region: { type: string }

        ssh:
          type: object
          properties:
            user: { type: string }
            key_path: { type: string }

        ssh_host:
          type: string

        network:
          type: object
          properties:
            remote_host: { type: string }

        behavior:
          type: object
          properties:
            autostart: { type: boolean }
