# =============================================================================
# sshMenu.schema.yaml
# -----------------------------------------------------------------------------
# JSON Schema for sshMenu.yaml
#
# PURPOSE
# -------
# Defines the structural contract for SSH / SSM access catalogs.
#
# This schema validates:
# - Access endpoints (not applications)
# - Infrastructure, service and maintenance access
#
# It does NOT validate:
# - Network reachability
# - SSH execution semantics
# - Runtime behavior
#
# =============================================================================

$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - sshMenu

properties:
  sshMenu:
    type: object
    required:
      - version
      - environments
      - connection_groups

    properties:

      version:
        type: number

      description:
        type: string

      defaults:
        type: object
        properties:
          user:
            type: string
          access:
            type: string
            enum: [ssm]

      # -----------------------------------------------------------------------
      # ENVIRONMENTS
      # -----------------------------------------------------------------------
      environments:
        type: object
        additionalProperties:
          type: object
          required:
            - label
            - type
          properties:
            label:
              type: string
            type:
              type: string
              enum: [aws, local]
            account:
              type: string
            region:
              type: string

      # -----------------------------------------------------------------------
      # CONNECTION GROUPS
      # -----------------------------------------------------------------------
      connection_groups:
        type: object
        additionalProperties:
          type: object
          required:
            - label
            - order
            - connections

          properties:
            label:
              type: string

            description:
              type: string

            order:
              type: integer

            connections:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - id
                  - label
                  - environment
                  - host
                  - role

                properties:

                  id:
                    type: string
                    pattern: "^[a-z0-9-]+$"

                  label:
                    type: string

                  environment:
                    type: string

                  host:
                    type: string

                  user:
                    type: string

                  access:
                    type: string
                    enum: [ssm]

                  role:
                    type: string
                    enum:
                      - api
                      - frontend
                      - database
                      - worker
                      - infrastructure

                  purpose:
                    type: array
                    items:
                      type: string

                  notes:
                    type: string

      # -----------------------------------------------------------------------
      # POLICIES
      # -----------------------------------------------------------------------
      policies:
        type: object
        properties:
          ssh_ports_exposed:
            type: boolean
          persistent_tunnels_allowed:
            type: boolean
          access_method:
            type: string

      # -----------------------------------------------------------------------
      # NOTES
      # -----------------------------------------------------------------------
      notes:
        type: string
